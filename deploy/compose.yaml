services:
  dbt-events-consumer:
    image: hazinuddin/dbt-route-events-worker:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30m
    env_file:
      - .env
    environment:
      DBT_PROJECT_DIR: /app/events_analysis
      DBT_PROFILES_DIR: /run/secrets/dbt
      RABBITMQ_QUEUE: dbt.events.worker
      RABBITMQ_DLQ: dbt.events.worker.dlq
      RABBITMQ_ROUTING_KEYS: verified.rni,verified.iri,verified.pci
      LOG_DIR: /var/log/dbt-events
    networks:
      - backend
    volumes:
      - ./secrets/profiles.yml:/run/secrets/dbt/profiles.yml:ro
      - dbt-target:/app/events_analysis/target
      - dbt-logs:/app/events_analysis/logs
      - consumer-logs:/var/log/dbt-events
    read_only: true
    tmpfs:
      - /tmp

  traffic-events-consumer:
    image: hazinuddin/traffic-route-events-worker:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    stop_grace_period: 30m
    env_file:
      - .env
    environment:
      RABBITMQ_QUEUE: traffic.events.worker
      RABBITMQ_DLQ: traffic.events.worker.dlq
      RABBITMQ_ROUTING_KEYS: verified.rtc
      LOG_DIR: /var/log/traffic-events
      TRAFFIC_TARGET_TABLE: SMD.AADT
    networks:
      - backend
    volumes:
      - traffic-logs:/var/log/traffic-events
    read_only: true
    tmpfs:
      - /tmp

networks:
  backend:
    external: true
    name: bm-route-events_backend

volumes:
  dbt-logs:
  dbt-target:
  consumer-logs:
  traffic-logs:
